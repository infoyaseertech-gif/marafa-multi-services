<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password &mdash; Marafa Multi-Services Limited</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-badge"><img src="../assets/logo.png" alt="Marafa Multi-Services logo"></div>
      <div class="co-name">MARAFA MULTI-SERVICES LIMITED</div>
      <div class="co-sub">RESET PASSWORD</div>
    </div>
    <div class="login-box">
      <form id="newPasswordForm">
        <p style="font-size:13px;color:#5b6570;margin-top:0;">Choose a new password for your account.</p>
        <div class="form-field">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" placeholder="At least 6 characters">
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirm New Password</label>
          <input id="confirmPassword" type="password" placeholder="Repeat password">
        </div>
        <div class="login-error" id="resetError"></div>
        <button type="submit" class="btn-brass" id="submitBtn">Set New Password</button>
      </form>
      <div id="doneMessage" style="display:none;text-align:center;">
        <p style="font-size:14px;color:#1f6d33;font-weight:600;">Password updated successfully.</p>
        <a href="login.html" class="btn-brass" style="display:block;text-decoration:none;text-align:center;">Go to Sign In</a>
      </div>
      <div id="invalidLinkMessage" style="display:none;">
        <p style="font-size:13.5px;color:#e11d48;">This reset link is invalid or has expired. Request a new one from the sign-in page.</p>
        <a href="login.html" style="color:#5b6570;font-size:13px;">&larr; Back to Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  (async function init() {
    // Supabase-js automatically parses the recovery token from the URL and
    // establishes a temporary "recovery" session when this page loads.
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      document.getElementById("newPasswordForm").style.display = "none";
      document.getElementById("invalidLinkMessage").style.display = "block";
      return;
    }

    document.getElementById("newPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const next = document.getElementById("newPassword").value;
      const confirmVal = document.getElementById("confirmPassword").value;
      const errorBox = document.getElementById("resetError");
      const btn = document.getElementById("submitBtn");
      errorBox.textContent = "";

      if (next.length < 6) { errorBox.textContent = "Password must be at least 6 characters."; return; }
      if (next !== confirmVal) { errorBox.textContent = "Passwords do not match."; return; }

      btn.disabled = true; btn.textContent = "Saving…";
      const { error } = await sb.auth.updateUser({ password: next });
      btn.disabled = false; btn.textContent = "Set New Password";
      if (error) { errorBox.textContent = error.message; return; }

      document.getElementById("newPasswordForm").style.display = "none";
      document.getElementById("doneMessage").style.display = "block";
    });
  })();
</script>
</body>
</html>
